<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .containerA {
        width: 100%;
        height: 100vh;
        display: flex;
        border-style: solid;
      }

      .containerB {
        width: 20%;
        height: 100vh;
        display: flex;
        border-style: solid;
        flex-direction: column;
      }

      .containerC {
        width: 80%;
        height: 100vh;
        display: flex;
        border-style: solid;
        flex-direction: column;
      }

      .containerDC {
        width: 100%;
        height: 10vh;
        display: flex;
        border-style: solid;
      }

      .containerEC {
        width: 100%;
        height: 50vh;
        display: flex;
        border-style: solid;
      }

      .containerFC {
        width: 100%;
        height: 40vh;
        display: flex;
        border-style: solid;
      }

      .Bb {
        background-color: green;
        width: 100%;
        height: 10vh;
      }

      .bbb {
        justify-self: flex-end;
        background-color: red;
        height: 5vh;
        width: 85%;
        border-style: solid;
        align-self: flex-end;
      }

      .bb {
        background-color: red;
        height: 5vh;
        width: 85%;
        border-style: solid;
      }
    </style>
  </head>
  <body>
    <div class="containerA">
      <div class="containerB">
        <div class="Bb">Bb</div>
        <div class="bb"></div>
        <div class="bb"></div>
        <div class="bb"></div>
        <div class="bb"></div>
        <div class="bb"></div>
        <div class="bb"></div>
        <div class="bbb">bbb</div>
      </div>
      <!--gehört nur in A-->

      <div class="containerC">
        <!--gehört nur in A-->

        <div class="containerDC">DC</div>
        <!--gehört  in C-->

        <div class="containerEC">EC</div>
        <!--gehört  in C-->

        <div class="containerFC">FC</div>
        <!--gehört  in C-->
      </div>
    </div>
  </body>
</html>
